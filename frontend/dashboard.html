<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3b45" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Dashboard · WaterMate</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__drop"></span>
        WaterMate
      </div>
      <nav class="topbar__nav">
        <a href="dashboard.html" class="is-active">Dashboard</a>
        <a href="members.html">Members</a>
        <a href="history.html">History</a>
        <a href="group.html">Switch group</a>
      </nav>
      <div class="topbar__user" id="userBox"></div>
    </header>

    <main class="main">
      <div id="pageAlert"></div>

      <div id="dashboardContent">
        <div class="loading-row"><div class="spinner"></div><span>Loading dashboard&hellip;</span></div>
      </div>
    </main>

    <!-- Mobile App Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Mobile Navigation">
      <a href="dashboard.html" class="bottom-nav__item is-active">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="members.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Order</span>
      </a>
      <a href="history.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>History</span>
      </a>
      <a href="group.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Groups</span>
      </a>
    </nav>
  </div>

  <!-- Submit water modal -->
  <div class="modal-overlay" id="submitModal" hidden>
    <div class="modal">
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
