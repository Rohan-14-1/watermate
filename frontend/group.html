<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b3b45" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Your groups · WaterMate</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar__brand">
        <span class="topbar__drop"></span>
        WaterMate
      </div>
      <div class="topbar__user" id="userBox"></div>
    </header>

    <main class="main">
      <div id="pageAlert"></div>

      <h1>Your groups</h1>
      <p class="text-muted">Pick a group to open its dashboard, or set up a new one.</p>

      <div id="groupsSection">
        <div class="loading-row"><div class="spinner"></div><span>Loading your groups&hellip;</span></div>
      </div>

      <div class="section-title">CREATE OR JOIN A GROUP</div>
      <div class="two-col">
        <div class="card">
          <h3>Create a group</h3>
          <p class="text-muted">Start a rotation for your flat and get an invite code to share.</p>
          <form id="createGroupForm">
            <div class="field">
              <label for="groupName">Group name</label>
              <input type="text" id="groupName" placeholder="Sunrise Apartment" required />
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="createBtn">Create group</button>
          </form>
          <div id="createResult"></div>
        </div>

        <div class="card">
          <h3>Join a group</h3>
          <p class="text-muted">Enter the invite code a roommate shared with you.</p>
          <form id="joinGroupForm">
            <div class="field">
              <label for="inviteCode">Invite code</label>
              <input type="text" id="inviteCode" placeholder="WM4821" style="text-transform:uppercase" required />
            </div>
            <button type="submit" class="btn btn-outline btn-block" id="joinBtn">Join group</button>
          </form>
          <div id="joinResult"></div>
        </div>
      </div>
    </main>

    <!-- Mobile App Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Mobile Navigation">
      <a href="dashboard.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>Home</span>
      </a>
      <a href="members.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span>Order</span>
      </a>
      <a href="history.html" class="bottom-nav__item">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>History</span>
      </a>
      <a href="group.html" class="bottom-nav__item is-active">
        <svg class="bottom-nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Groups</span>
      </a>
    </nav>
  </div>

  <script src="js/api.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
